name: update-signatures

# Monthly: build the newest PRONOM release and open a PR adding fidosigs/resources/format/vNNN.
# A human reviews and merges; publish.yml then tests and ships the image.
#
# Takes 30-40 minutes: one PRONOM record per PUID, throttled at 0.5 s to spare PRONOM.
# Do not parallelise it.
#
# PRs opened with GITHUB_TOKEN do not trigger other workflows, so test.yml does not run on
# the PR itself. publish.yml runs the tests again on merge and will not push a failing build.
on:
  schedule:
    - cron: "17 3 2 * *"
  workflow_dispatch:
    inputs:
      version:
        description: PRONOM version number to build (blank for latest)
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-signatures

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r scripts/requirements.txt

      - name: Generate release
        id: generate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set +e
          python scripts/generate_signatures.py --format-dir fidosigs/resources/format --work-dir .work ${VERSION:+--version "$VERSION"}
          status=$?
          set -e
          case $status in
            0) echo "release=$(git status --porcelain fidosigs/resources/format | sed -nE 's#.*format/(v[0-9]+)/.*#\1#p' | head -1)" >> "$GITHUB_OUTPUT" ;;
            2) echo "::notice::Newest PRONOM release is already in the repository" ;;
            *) exit "$status" ;;
          esac

      - name: Open pull request
        if: steps.generate.outputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.generate.outputs.release }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          branch="signatures/$RELEASE"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "::notice::$branch already exists, leaving the open PR alone"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "fidosigs/resources/format/$RELEASE"
          git commit -m "feat(data): add PRONOM $RELEASE signatures"
          git push origin "$branch"
          gh pr create --base "$BASE" --head "$branch" \
            --title "feat(data): add PRONOM $RELEASE signatures" \
            --body "Generated by update-signatures from PRONOM. Merge, then follow docs/operations.md to publish $RELEASE to the live service."
