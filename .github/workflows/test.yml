name: test

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            scripts/requirements.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest

      - name: Deployment files parse
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml config -q
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml config -q
          docker compose -f deploy/docker-compose.yml --profile tunnel config -q
